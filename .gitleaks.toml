# Secrets scan (gitleaks) for the Security job: the default rules, plus what they must not take for a leak.
title = "neVus"

[extend]
useDefault = true

[allowlist]
description = "Documented one-time-code test vectors, not secrets"
regexes = [
  # RFC 6238, appendix B: the seed "12345678901234567890" in base32, used by the tests of the second factor.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  # The example authenticator secret of the frontend's mock API.
  '''JBSWY3DPEHPK3PXP''',
  # RFC 8291, appendix A: the authentication secret and the keys of the worked example, used by the push tests.
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  '''BP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A8''',
]
