[project]
name = "nevus"
version = "0.0.0"
description = "Self-hosted longitudinal tracking of moles and skin marks. Not a diagnostic tool."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.40",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "structlog>=24.4",
  "psycopg[binary]>=3.2",
  "pillow>=11.0",
  "pillow-heif>=1.0",
  "python-multipart>=0.0.20",
]

[project.scripts]
nevus = "nevus.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nevus"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["nevus"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["argon2.*", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nevus.*"]
