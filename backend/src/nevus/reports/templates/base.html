<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<title>{{ title }} · {{ person }}</title>
<meta name="author" content="neVus">
<meta name="generator" content="neVus">
<link rel="stylesheet" href="report.css">
<style>
:root {
{% for name, value in colours.items() %}
  --color-{{ name }}: {{ value }};
{% endfor %}
}
@page {
  size: {{ paper }};
  margin: 14mm 15mm 16mm;
  @bottom-left { content: {{ footer|safe }}; font-family: Epilogue; font-size: 6.5pt; color: var(--color-ink-3); }
  @bottom-right { content: {{ page_counter|safe }}; font-family: Epilogue; font-size: 6.5pt; color: var(--color-ink-3); }
}
</style>
</head>
<body>
<header class="brand">
  <img src="wordmark.svg" alt="neVus" translate="no">
  <div class="title">
    <h1>{{ title }}</h1>
    <p class="who">{{ person }}{% if born %} · {{ born }}{% endif %}</p>
    <p>{{ generated }}</p>
  </div>
</header>
<p class="intended-use">{{ w("intended_use") }}</p>
{% block content %}{% endblock %}
</body>
</html>
