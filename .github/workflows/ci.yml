name: CI

on:
  pull_request:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, nevus]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check every commit message in the pull request
        run: uvx --from commitizen cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

  backend:
    name: Backend
    runs-on: [self-hosted, nevus]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nevus
          POSTGRES_PASSWORD: nevus
          POSTGRES_DB: nevus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nevus" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check . ../tools
          uv run ruff format --check . ../tools
      - name: Type check
        run: uv run mypy
      - name: Report renderer libraries
        run: |
          if ! ldconfig -p | grep -q libpangoft2-1.0; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          fi
      - name: Tests on SQLite
        # Two workers for the runner's two cores; every test has its own data directory.
        run: uv run pytest -n 2 --cov=nevus --cov-report=term-missing
      - name: Tests on PostgreSQL
        # One worker: the tests share the service's single database.
        env:
          NEVUS_DATABASE_URL: postgresql+psycopg://nevus:nevus@localhost:5432/nevus
        run: uv run pytest
      - name: OpenAPI snapshot is current
        run: |
          uv run nevus openapi > /tmp/openapi.json
          diff -q /tmp/openapi.json ../frontend/openapi.json || { echo "frontend/openapi.json is stale: run 'just openapi'"; exit 1; }
      - name: Body map copies are identical
        run: cmp src/nevus/bodymap/zones.json ../frontend/src/features/bodymap/zones.json
      - name: Migrations on SQLite
        env:
          NEVUS_DATA_DIR: ${{ runner.temp }}/sqlite
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Migrations on PostgreSQL
        env:
          NEVUS_DATABASE_URL: postgresql+psycopg://nevus:nevus@localhost:5432/nevus
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend
    runs-on: [self-hosted, nevus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm openapi
          git diff --exit-code -- src/lib/api/schema.d.ts || { echo "src/lib/api/schema.d.ts is stale: run 'just openapi'"; exit 1; }
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End to end
    runs-on: [self-hosted, nevus]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Backend environment
        working-directory: backend
        run: uv sync --frozen
      - run: pnpm build
      - name: Report renderer libraries
        run: |
          if ! ldconfig -p | grep -q libpangoft2-1.0; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          fi
      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Journey on a phone-sized browser, with accessibility checks
        env:
          CI: "1"
          NEVUS_E2E_DATA: ${{ runner.temp }}/e2e-data
        run: pnpm e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    name: Container image
    runs-on: [self-hosted, nevus]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f deploy/Dockerfile --build-arg VERSION=ci -t nevus:ci .
      - name: Size budget (550 MB)
        run: |
          size=$(docker image inspect nevus:ci --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((550 * 1024 * 1024))
      - name: Start, answer, and run as the right user
        run: |
          mkdir -p ci-data
          docker run -d --name nevus -p 8080:8080 -v "$PWD/ci-data:/data" nevus:ci
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          # The index must answer 200 without a session: CasaOS accepts only 200 or 401 there.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          curl -fsS http://127.0.0.1:8080/ | grep -q "neVus"
          uid=$(docker exec nevus sh -c 'stat -c %u /proc/1')
          echo "pid 1 runs as uid $uid"; test "$uid" = "1000"
          docker rm -f nevus
      - name: Honour PUID and PGID on a root-owned bind mount
        run: |
          sudo mkdir -p ci-data-puid && sudo chown root:root ci-data-puid
          docker run -d --name nevuspuid -e PUID=1500 -e PGID=1500 -p 8081:8080 -v "$PWD/ci-data-puid:/data" nevus:ci
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8081/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8081/healthz | grep -q '"storage":"ok"'
          uid=$(docker exec nevuspuid sh -c 'stat -c %u /proc/1')
          echo "pid 1 runs as uid $uid"; test "$uid" = "1500"
          docker rm -f nevuspuid
      - name: Leave nothing behind on the runner
        if: always()
        run: docker rm -f nevus nevuspuid >/dev/null 2>&1 || true

  security:
    name: Security
    runs-on: [self-hosted, nevus]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit
        working-directory: backend
        # Hashes in the export are per wheel; pip-audit resolves on its own interpreter, so audit the pinned
        # versions without hashes and on the project's Python.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx --python 3.13 pip-audit --strict -r /tmp/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - name: JavaScript dependency audit
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
